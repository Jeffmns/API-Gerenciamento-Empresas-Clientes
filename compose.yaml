services:
  db:
    image: postgres:17-alpine
    container_name: empresas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: empresas
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d empresas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: